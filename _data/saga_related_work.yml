# Selected work grouped by research direction and subtheme.
# Each paper has a full title, URL, concise venue, and one-sentence contribution summary.
# Within each group, follow the Papers page order (newest first).
foundations:
  - label: "Statistical optimality"
    papers:
      - title: "Minimax Optimal Deep Neural Network Classifiers Under Smooth Decision Boundary"
        url: https://arxiv.org/abs/2207.01602
        venue: "JMLR 2025"
        summary: "We construct neural classifiers that achieve minimax rates under smooth decision boundaries and localized noise conditions, while adapting to low-dimensional structure."
      - title: "Random Smoothing Regularization in Kernel Gradient Descent Learning"
        url: https://arxiv.org/abs/2305.03531
        venue: "JMLR 2024"
        summary: "We show how random smoothing regularizes kernel gradient descent, deriving learning rates that exploit function smoothness and low-dimensional or tensor structure."
  - label: "Algorithmic guarantees"
    papers:
      - title: "Understanding Square Loss in Training Overparametrized Neural Network Classifiers"
        url: https://arxiv.org/abs/2112.03657
        venue: "NeurIPS 2022 · Spotlight"
        summary: "We prove fast classification and probability-calibration rates for neural networks trained with square loss in the neural tangent kernel regime."
      - title: "Regularization Matters: A Nonparametric Perspective on Overparametrized Neural Network"
        url: https://arxiv.org/abs/2007.02486
        venue: "AISTATS 2021"
        summary: "We show how ℓ2 regularization enables minimax-optimal estimation in overparameterized one-hidden-layer ReLU networks, linking gradient descent to neural tangent kernel ridge regression."
  - label: "Representation learning"
    papers:
      - title: "Complexity Matters: Rethinking the Latent Space for Generative Modeling"
        url: https://arxiv.org/abs/2307.08283
        venue: "NeurIPS 2023 · Spotlight"
        summary: "We connect latent-space design to generator complexity, developing autoencoders that improve visual generation quality with simpler models."
      - title: "Your Contrastive Learning Is Secretly Doing Stochastic Neighbor Embedding"
        url: https://arxiv.org/abs/2205.14814
        venue: "ICLR 2023"
        summary: "We connect contrastive learning to stochastic neighbor embedding, explaining how augmentations shape representations and guiding improvements in generalization."

vision:
  - label: "Efficient sampling"
    papers:
      - title: "Accelerating Diffusion Sampling with Optimized Time Steps"
        url: https://arxiv.org/abs/2402.17376
        venue: "CVPR 2024"
        summary: "We optimize sampling time steps to reduce discretization error, improving image quality under tight sampling budgets without retraining the diffusion model."
      - title: "Diff-Instruct: A Universal Approach for Transferring Knowledge From Pre-trained Diffusion Models"
        url: https://arxiv.org/abs/2305.18455
        venue: "NeurIPS 2023"
        summary: "We introduce distribution-matching distillation that transfers knowledge from pretrained diffusion models into one-step generators without requiring training data."
  - label: "Control and preference alignment"
    papers:
      - title: "TDM-R1: Reinforcing Few-Step Diffusion Models with Non-Differentiable Reward"
        url: https://arxiv.org/abs/2603.07700
        venue: "ICML 2026"
        summary: "We introduce the first scalable reinforcement learning framework using non-differentiable rewards for few-step text-to-image models, improving compositional generation and preference alignment."
      - title: "Reward-Instruct: A Reward-Centric Approach to Fast Photo-Realistic Image Generation"
        url: https://arxiv.org/abs/2503.13070
        venue: "NeurIPS 2025"
        summary: "We show that regularized reward maximization alone can deliver high-quality, controllable few-step generation, without requiring diffusion distillation losses."

language:
  - label: "Mechanism & Architecture"
    papers:
      - title: "The Structural Origin of Attention Sink: Variance Discrepancy, Super Neurons, and Dimension Disparity"
        url: https://arxiv.org/abs/2605.06611
        venue: "ICML 2026"
        summary: "We uncover the structural origins of attention sinks, explain how gating mitigates them, and develop head-wise RMSNorm to accelerate language model pretraining."
      - title: "PrefixMemory-Tuning: Modernizing Prefix-Tuning by Decoupling the Prefix from Attention"
        url: https://arxiv.org/abs/2506.13674
        venue: "ICLR 2026"
        summary: "We build on the connection between context and model weights, creating trainable memory outside attention for expressive, parameter-efficient adaptation of language models."
  - label: "Diffusion language models"
    papers:
      - title: "Any-Order GPT as Masked Diffusion Model: Decoupling Formulation and Architecture"
        url: https://arxiv.org/abs/2506.19935
        venue: "ICML 2026 · Oral"
        summary: "We formulate masked diffusion as any-order autoregression within a GPT architecture, separating modeling choices from architecture and enabling faster inference at comparable perplexity."
      - title: "Variational Autoencoding Discrete Diffusion with Enhanced Dimensional Correlations Modeling"
        url: https://arxiv.org/abs/2505.17384
        venue: "ICLR 2026"
        summary: "We introduce latent variables to capture dependencies between token positions, improving discrete diffusion generation quality with few denoising steps."
