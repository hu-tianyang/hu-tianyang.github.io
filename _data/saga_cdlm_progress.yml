- title: Designing Transformers for Continuous Diffusion Language Models
  topic: Architecture design
  paper_url: https://arxiv.org/abs/2610.22330
  date: '2026-10-15'
  summary: >-
    LangDiT redesigns the transformer backbone for continuous diffusion language
    modeling, improving generation while retaining the underlying token
