# Build and run the homepage image locally.
services:
  jekyll:
    image: hu-tianyang-homepage:local
    build: .
    # uncomment these if you are having this issue with the build:
    # /usr/local/bundle/gems/jekyll-4.3.4/lib/jekyll/site.rb:509:in `initialize': Permission denied @ rb_sysopen - /srv/jekyll/.jekyll-cache/.gitignore (Errno::EACCES)
    # and fill the args values with the output of the commands on the right
    # build:
    #   args:
    #     GROUPID: # id -g
    #     GROUPNAME: # id -gn
    #     USERID: # id -u
    #     USERNAME: # echo $USER
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
      - BUNDLE_FROZEN=true
      - BUNDLE_IGNORE_CONFIG=true
    # Run Jekyll in the foreground so a build failure also stops the container.
    # Bypass the template entry script, which can rewrite Gemfile.lock.
    command:
      - bundle
      - exec
      - jekyll
      - serve
      - --config
      - _config.yml,_config.local.yml
      - --host=0.0.0.0
      - --port=8080
      - --livereload
      - --force_polling
